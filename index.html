<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Rayo de Hortaleza</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="authPopup" class="popup">
        <h1>Rayo de Hortaleza</h1>
        <div class="popup-content">
            <h3>¿Eres jugador del equipo?</h3>
            <button id="botonSi">Sí</button>
            <button id="botonNo">No</button>
        </div>
    </div>
    <button id="installBtn" style="display:none;">Instalar app</button>
    <script type="module" src="js/index.js"></script>
    <script>
        let deferredPrompt;

        window.addEventListener("beforeinstallprompt", (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById("installBtn").style.display = "block";
        });

        document.getElementById("installBtn").addEventListener("click", () => {
            deferredPrompt.prompt();
        });
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }
    </script>
</body>
</html>
